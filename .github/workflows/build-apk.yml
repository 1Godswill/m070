{"name":"Build SSSACAD APK","on":"workflow_dispatch","jobs":{"apk":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"gradle/actions/setup-gradle@v3","with":{"gradle-version":"8.7"}},{"run":"find . -maxdepth 3 -not -path './.git/*' | head -60"},{"run":"D=$(dirname $(find . -name settings.gradle -not -path './.git/*' | head -n 1)); echo Project folder: $D; cd $D && gradle assembleDebug"},{"run":"mkdir -p out && find . -name '*.apk' -path '*debug*' -exec cp -t out/ {} +"},{"uses":"actions/upload-artifact@v4","with":{"name":"SSSACAD-apk","path":"out/*.apk"}}]}}}
